name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Build
        run: make clean && make

      - name: Unit tests
        run: make unit

      - name: Fuzz (DNS parser)
        run: make fuzz

      - name: Smoke test (if dig available)
        run: |
          if command -v dig >/dev/null 2>&1; then
            make test
          else
            echo "dig not installed — skipping make test (unit+fuzz already ran)"
          fi
