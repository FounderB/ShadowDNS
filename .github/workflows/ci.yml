name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config dnsutils curl

      - name: Build
        # Soft eBPF fallback in Makefile; CI forces userspace for kernel/bpftool variance
        run: make clean && SD_NO_EBPF=1 make

      - name: Unit tests
        run: make unit

      - name: Fuzz (DNS parser)
        run: make fuzz

      - name: Smoke test
        run: make test
